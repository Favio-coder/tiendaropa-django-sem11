{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda de Ropa{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="{% url 'prendas:home' %}">Tienda de Ropa Huancayo</a></h1>
            <nav class="nav">
                <a href="{% url 'prendas:home' %}">Inicio</a>
                <a href="{% url 'prendas:catalogo' %}">Catálogo</a>
                <a href="{% url 'admin:index' %}">Administración</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {% now "Y" %} Tienda de Ropa Huancayo. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
